[package]
name = "pair-landlock"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "paired-coding's Linux write fence: applies a Landlock ruleset read from stdin, then runs /bin/sh -c <command>"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
